<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>兒童中文神射手 - 認字靶場遊戲</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --secondary-color: #FF6B6B;
      --accent-color: #FFD166;
      --success-color: #06D6A0;
      --dark-color: #2B2D42;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #1a1c2e 0%, #2b3054 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app-container {
      width: 100vw;
      height: 100vh;
      max-width: 1024px;
      max-height: 768px;
      position: relative;
      background: #87CEEB;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 12px;
    }

    /* Target Range Background */
    .sky-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #4a90e2 0%, #a0c4ff 60%, #cbd5e1 100%);
      z-index: 1;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50px;
      animation: floatCloud linear infinite;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
    }
    .cloud1 { width: 120px; height: 40px; top: 10%; left: -120px; animation-duration: 25s; }
    .cloud1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
    .cloud1::after { width: 40px; height: 40px; top: -15px; left: 55px; }

    .cloud2 { width: 160px; height: 50px; top: 25%; left: -160px; animation-duration: 35s; animation-delay: 5s; }
    .cloud2::before { width: 60px; height: 60px; top: -25px; left: 30px; }
    .cloud2::after { width: 50px; height: 50px; top: -20px; left: 75px; }

    @keyframes floatCloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(1200px); }
    }

    /* Screen Views */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.4s ease;
    }

    .hidden {
      display: none !important;
      opacity: 0;
      pointer-events: none;
    }

    /* Setup Screen */
    #setup-screen {
      background: rgba(0, 0, 0, 0.3);
      z-index: 30;
      overflow-y: auto;
    }

    .card {
      background: white;
      padding: 25px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 520px;
      text-align: center;
      border: 4px solid var(--accent-color);
    }

    h1 {
      color: #2b3054;
      font-size: 26px;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .word-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .word-input-row label {
      font-weight: bold;
      width: 60px;
      color: var(--primary-color);
      font-size: 15px;
    }
    .word-input-row input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
      outline: none;
    }
    .word-input-row input:focus {
      border-color: var(--primary-color);
    }

    .setting-row {
      display: flex;
      justify-content: space-around;
      margin-bottom: 18px;
      background: #f0f4f8;
      padding: 10px;
      border-radius: 12px;
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      font-weight: bold;
      color: #444;
    }
    .setting-item select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      background: white;
    }

    .btn-start {
      background: linear-gradient(to bottom, #FF8E53, #FF6B6B);
      color: white;
      border: none;
      padding: 12px 35px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #d04040, 0 10px 15px rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-start:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d04040, 0 4px 8px rgba(0,0,0,0.2);
    }

    /* Gameplay HUD */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 15;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 2px solid #FFD166;
      pointer-events: auto;
    }

    .btn-audio {
      background: #4A90E2;
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      pointer-events: auto;
    }

    /* Canvas FX Layer */
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* Floating Target Boards */
    #targets-container {
      position: absolute;
      top: 75px;
      left: 0;
      width: 100%;
      height: 52%;
      z-index: 8;
    }

    .target-board {
      position: absolute;
      width: 130px;
      height: 100px;
      background: linear-gradient(to bottom, #d4a373 0%, #faedcd 15%, #ccd5ae 100%);
      border: 4px solid #8c5a3c;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .target-board:hover {
      transform: scale(1.05);
    }
    .target-board::before {
      content: '';
      position: absolute;
      top: -25px;
      width: 4px;
      height: 25px;
      background: #555;
    }
    .target-word {
      font-size: 40px;
      font-weight: 900;
      color: #2b2d42;
      text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
      z-index: 2;
    }

    /* Cannon & Smart Kid Container */
    #shooter-assembly {
      position: absolute;
      bottom: -15px;
      left: 50%;
      width: 240px;
      height: 240px;
      transform: translateX(-50%) rotate(0deg);
      transform-origin: 50% 85%;
      z-index: 9;
      pointer-events: none;
      transition: transform 0.15s ease-out;
    }

    /* Target Shake FX */
    .hit-shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px) rotate(-5deg); }
      40%, 80% { transform: translateX(10px) rotate(5deg); }
    }

    /* Floating Score Badge */
    .floating-badge {
      position: absolute;
      font-size: 24px;
      font-weight: 900;
      color: #FFD166;
      text-shadow: 0 0 10px rgba(0,0,0,0.8), 2px 2px 0 #000;
      pointer-events: none;
      z-index: 25;
      animation: floatUp 1.2s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.5); }
      30% { opacity: 1; transform: translateY(-30px) scale(1.3); }
      100% { opacity: 0; transform: translateY(-80px) scale(1); }
    }

    /* Modals / Victory Screens */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 40;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: white;
      padding: 30px;
      border-radius: 24px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      border: 5px solid var(--accent-color);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .btn-next {
      background: var(--success-color);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 0 #049f75;
    }

    /* Grand Victory Finale Screen */
    #victory-screen {
      background: radial-gradient(circle, #2b3054 0%, #1a1c2e 100%);
      z-index: 50;
      color: white;
      text-align: center;
    }
    .trophy-box {
      font-size: 80px;
      animation: bounceTrophy 1.2s infinite alternate ease-in-out;
      margin-bottom: 10px;
    }
    @keyframes bounceTrophy {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-15px) scale(1.1); }
    }
    .victory-title {
      font-size: 36px;
      color: #FFD166;
      text-shadow: 0 0 20px rgba(255,209,102,0.6);
      margin-bottom: 10px;
    }
    .badge-rank {
      background: linear-gradient(45deg, #FF6B6B, #FF8E53);
      display: inline-block;
      padding: 8px 22px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(255,107,107,0.4);
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Sky Background -->
  <div class="sky-bg">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
  </div>

  <!-- FX Canvas Layer -->
  <canvas id="game-canvas"></canvas>

  <!-- Setup Screen -->
  <div id="setup-screen" class="screen">
    <div class="card">
      <h1>🎯 兒童中文神射手 🎯</h1>
      <p class="subtitle">家長輸入 5 個詞語，開始樂趣無窮的聽讀認字靶場遊戲！</p>
      
      <div class="input-group">
        <div class="word-input-row">
          <label>詞語 1</label>
          <input type="text" id="w0" value="太陽" maxlength="6">
        </div>
        <div class="word-input-row">
          <label>詞語 2</label>
          <input type="text" id="w1" value="月亮" maxlength="6">
        </div>
        <div class="word-input-row">
          <label>詞語 3</label>
          <input type="text" id="w2" value="星星" maxlength="6">
        </div>
        <div class="word-input-row">
          <label>詞語 4</label>
          <input type="text" id="w3" value="雲朵" maxlength="6">
        </div>
        <div class="word-input-row">
          <label>詞語 5</label>
          <input type="text" id="w4" value="彩虹" maxlength="6">
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-item">
          <label for="voice-select">🗣️ 發音語言</label>
          <select id="voice-select">
            <option value="zh-HK">廣東話 (zh-HK)</option>
            <option value="zh-TW">普通話 (zh-TW)</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="speed-select">⚡ 靶位速度</label>
          <select id="speed-select">
            <option value="slow">🐢 慢速</option>
            <option value="medium" selected>🚶 中速</option>
            <option value="fast">🐇 快速</option>
          </select>
        </div>
      </div>

      <button class="btn-start" onclick="startGame()">進入靶場射擊 Start Shooting</button>
    </div>
  </div>

  <!-- Gameplay HUD -->
  <div id="hud" class="hidden">
    <div class="hud-box">
      <span>第 <span id="current-q">1</span> / 5 題</span>
    </div>
    <button class="btn-audio" onclick="speakCurrentWord()">🔊</button>
    <div class="hud-box" style="color: #FF6B6B;">
      <span>🏆 1級神射手</span>
    </div>
  </div>

  <!-- Target Floating Area -->
  <div id="targets-container"></div>

  <!-- Smart Kid Holding Cannon Assembly -->
  <div id="shooter-assembly">
    <svg width="240" height="240" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Kid Cape -->
      <path d="M70 190 Q130 220 190 190 L180 250 Q130 260 80 250 Z" fill="#FF5722"/>
      <!-- Kid Body -->
      <circle cx="130" cy="180" r="45" fill="#3F51B5"/>
      <path d="M100 185 L160 185 L155 230 L105 230 Z" fill="#303F9F"/>
      <!-- Kid Arms holding Cannon -->
      <path d="M90 170 Q110 145 125 140" stroke="#FFCC80" stroke-width="16" stroke-linecap="round"/>
      <path d="M170 170 Q150 145 135 140" stroke="#FFCC80" stroke-width="16" stroke-linecap="round"/>
      
      <!-- Giant Laser Cannon -->
      <g id="laser-cannon">
        <rect x="110" y="30" width="40" height="110" rx="10" fill="url(#cannon-grad)" stroke="#2b2d42" stroke-width="4"/>
        <circle cx="130" cy="40" r="14" fill="#00E5FF"/>
        <circle cx="130" cy="40" r="8" fill="#FFFFFF"/>
        <rect x="105" y="90" width="50" height="20" rx="5" fill="#FFD166" stroke="#2b2d42" stroke-width="3"/>
        <circle cx="130" cy="100" r="5" fill="#FF6B6B"/>
      </g>

      <!-- Kid Head & Face -->
      <circle cx="130" cy="165" r="32" fill="#FFCC80"/>
      <!-- Cute Glasses -->
      <circle cx="118" cy="162" r="11" fill="none" stroke="#2B2D42" stroke-width="3"/>
      <circle cx="142" cy="162" r="11" fill="none" stroke="#2B2D42" stroke-width="3"/>
      <line x1="129" y1="162" x2="131" y2="162" stroke="#2B2D42" stroke-width="3"/>
      <circle cx="118" cy="162" r="4" fill="#2B2D42"/>
      <circle cx="142" cy="162" r="4" fill="#2B2D42"/>
      <!-- Smile -->
      <path d="M123 180 Q130 187 137 180" stroke="#D84315" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Hero Star Cap -->
      <path d="M95 155 Q130 120 165 155 Z" fill="#29B6F6"/>
      <polygon points="130,132 133,140 141,140 135,145 137,153 130,148 123,153 125,145 119,140 127,140" fill="#FFD166"/>
    </svg>
    <defs>
      <linearGradient id="cannon-grad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3A3D40"/>
        <stop offset="50%" stop-color="#606468"/>
        <stop offset="100%" stop-color="#3A3D40"/>
      </linearGradient>
    </defs>
  </div>

  <!-- Retry Modal -->
  <div id="retry-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 style="font-size: 28px; color: #FF6B6B;">💥 差一點點！</h2>
      <p style="font-size: 18px; margin: 12px 0; color: #555;">再試一次，仔細聽讀音喔！</p>
      <button class="btn-next" style="background: #FF6B6B;" onclick="closeRetryModal()">再試一次</button>
    </div>
  </div>

  <!-- Grand Victory Finale Screen -->
  <div id="victory-screen" class="screen hidden">
    <div class="trophy-box">🏆</div>
    <h1 class="victory-title">太厲害了！全部答對！</h1>
    <div class="badge-rank">🌟 獲得榮譽：1級神射手 🌟</div>
    <p style="font-size: 18px; color: #E2E8F0; margin-bottom: 20px;">成功擊中所有正確詞語標靶！</p>
    <button class="btn-start" onclick="resetToSetup()">再玩一次 Play Again</button>
  </div>
</div>

<script>
  let words = [];
  let currentQuestionIdx = 0;
  let targetSpeed = 'medium';
  let targetElements = [];
  let animationFrameId = null;
  let synth = window.speechSynthesis;
  let selectedVoiceLang = 'zh-HK';

  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
  }

  function playLaserSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  function playExplosionSound() {
    if (!audioCtx) return;
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, audioCtx.currentTime);
    filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.4);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  }

  function playVictoryFanfare() {
    if (!audioCtx) return;
    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const startTime = audioCtx.currentTime + idx * 0.1;
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.4);
    });
  }

  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let bullets = [];

  function resizeCanvas() {
    const container = document.getElementById('app-container');
    if (container) {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function renderFX() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    bullets.forEach((b, index) => {
      b.x += b.vx;
      b.y += b.vy;
      ctx.beginPath();
      ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#00E5FF';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00E5FF';
      ctx.fill();
      ctx.shadowBlur = 0;

      if (Math.hypot(b.x - b.targetX, b.y - b.targetY) < 25) {
        bullets.splice(index, 1);
        onBulletHit(b.targetElem, b.isCorrect);
      }
    });

    particles.forEach((p, index) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity || 0;
      p.alpha -= p.decay;

      if (p.alpha <= 0) {
        particles.splice(index, 1);
      } else {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        if (p.shape === 'star') {
          drawStar(ctx, p.x, p.y, 5, p.size, p.size / 2);
        } else {
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.restore();
      }
    });

    requestAnimationFrame(renderFX);
  }
  requestAnimationFrame(renderFX);

  function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
    let rot = Math.PI / 2 * 3;
    let x = cx, y = cy;
    let step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerRadius;
      y = cy + Math.sin(rot) * outerRadius;
      ctx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * innerRadius;
      y = cy + Math.sin(rot) * innerRadius;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
  }

  function createCelebration(x, y) {
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 10 + 3;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: 0.15,
        size: Math.random() * 8 + 5,
        color: ['#06D6A0', '#118AB2', '#FFD166', '#FF6B6B', '#9B5DE5'][Math.floor(Math.random() * 5)],
        alpha: 1,
        decay: Math.random() * 0.02 + 0.015,
        shape: Math.random() > 0.5 ? 'star' : 'circle'
      });
    }
  }

  function speakCurrentWord() {
    if (!words[currentQuestionIdx]) return;
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(words[currentQuestionIdx]);
    utterance.lang = selectedVoiceLang;
    utterance.rate = 0.85;
    synth.speak(utterance);
  }

  function startGame() {
    initAudio();
    words = [];
    for (let i = 0; i < 5; i++) {
      const val = document.getElementById(`w${i}`).value.trim();
      words.push(val || `詞語${i+1}`);
    }

    selectedVoiceLang = document.getElementById('voice-select').value;
    targetSpeed = document.getElementById('speed-select').value;

    currentQuestionIdx = 0;
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');

    loadQuestion();
  }

  function loadQuestion() {
    document.getElementById('current-q').innerText = currentQuestionIdx + 1;
    const container = document.getElementById('targets-container');
    container.innerHTML = '';
    targetElements = [];

    const correctAnswer = words[currentQuestionIdx];
    const distractorPool = ["水罐", "小鳥", "水果", "森林", "花朵", "大象", "飛機", "心願", "歡樂", "蘋果"];
    let distractors = distractorPool.filter(w => !words.includes(w)).sort(() => 0.5 - Math.random()).slice(0, 3);
    let choices = [correctAnswer, ...distractors].sort(() => 0.5 - Math.random());

    const positions = [
      { top: 15, left: 12 },
      { top: 15, left: 58 },
      { top: 55, left: 32 },
      { top: 55, left: 75 }
    ];

    choices.forEach((word, idx) => {
      const board = document.createElement('div');
      board.className = 'target-board';
      board.style.top = positions[idx].top + '%';
      board.style.left = positions[idx].left + '%';
      
      const isCorrect = (word === correctAnswer);
      board.innerHTML = `<span class="target-word">${word}</span>`;
      board.onclick = (e) => aimAndShoot(e, board, isCorrect);
      container.appendChild(board);

      targetElements.push({
        elem: board,
        phase: Math.random() * Math.PI * 2
      });
    });

    animateTargets();
    setTimeout(speakCurrentWord, 600);
  }

  function animateTargets() {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    const speedMult = targetSpeed === 'slow' ? 0.001 : (targetSpeed === 'medium' ? 0.0025 : 0.005);

    function step(timestamp) {
      targetElements.forEach((t) => {
        const offsetY = Math.sin(timestamp * speedMult + t.phase) * 12;
        t.elem.style.transform = `translateY(${offsetY}px)`;
      });
      animationFrameId = requestAnimationFrame(step);
    }
    animationFrameId = requestAnimationFrame(step);
  }

  function aimAndShoot(event, targetBoard, isCorrect) {
    const rect = targetBoard.getBoundingClientRect();
    const appRect = document.getElementById('app-container').getBoundingClientRect();
    const targetX = rect.left - appRect.left + rect.width / 2;
    const targetY = rect.top - appRect.top + rect.height / 2;

    const shooter = document.getElementById('shooter-assembly');
    const shooterX = appRect.width / 2;
    const shooterY = appRect.height - 40;

    const dx = targetX - shooterX;
    const dy = targetY - shooterY;
    const angleRad = Math.atan2(dy, dx);
    const angleDeg = angleRad * (180 / Math.PI) + 90;

    shooter.style.transform = `translateX(-50%) rotate(${angleDeg}deg)`;

    playLaserSound();
    const speed = 24;
    bullets.push({
      x: shooterX, y: shooterY,
      vx: Math.cos(angleRad) * speed,
      vy: Math.sin(angleRad) * speed,
      targetX: targetX, targetY: targetY,
      targetElem: targetBoard,
      isCorrect: isCorrect
    });
  }

  function onBulletHit(targetBoard, isCorrect) {
    const rect = targetBoard.getBoundingClientRect();
    const appRect = document.getElementById('app-container').getBoundingClientRect();
    const hitX = rect.left - appRect.left + rect.width / 2;
    const hitY = rect.top - appRect.top + rect.height / 2;

    if (isCorrect) {
      playVictoryFanfare();
      createCelebration(hitX, hitY);
      
      const badge = document.createElement('div');
      badge.className = 'floating-badge';
      badge.innerText = '⭐ 答對了！+100';
      badge.style.left = hitX - 50 + 'px';
      badge.style.top = hitY - 40 + 'px';
      document.getElementById('app-container').appendChild(badge);
      setTimeout(() => badge.remove(), 1200);

      setTimeout(() => {
        currentQuestionIdx++;
        if (currentQuestionIdx >= 5) {
          showGrandVictory();
        } else {
          loadQuestion();
        }
      }, 2500);
    } else {
      playExplosionSound();
      targetBoard.classList.add('hit-shake');
      setTimeout(() => targetBoard.classList.remove('hit-shake'), 400);

      setTimeout(() => {
        document.getElementById('retry-modal').classList.remove('hidden');
      }, 1500);
    }
  }

  function closeRetryModal() {
    document.getElementById('retry-modal').classList.add('hidden');
    speakCurrentWord();
  }

  function showGrandVictory() {
    document.getElementById('victory-screen').classList.remove('hidden');
    playVictoryFanfare();
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        createCelebration(
          Math.random() * canvas.width,
          Math.random() * (canvas.height * 0.6)
        );
      }, i * 400);
    }
  }

  function resetToSetup() {
    document.getElementById('victory-screen').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
    document.getElementById('targets-container').innerHTML = '';
  }
</script>
</body>
</html>
